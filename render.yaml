databases:
  - name: mustang-ball-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: mustang-ball-api
    runtime: node
    rootDir: server
    plan: free
    # db:seed is idempotent (it skips any content block or user that
    # already exists), so it's safe to run on every build. This avoids
    # needing Render's Shell tab, which isn't available on the free plan.
    buildCommand: npm install && npm run build && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mustang-ball-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: NODE_ENV
        value: production
      # Update this after your GitHub Pages URL is known, e.g.
      # https://<github-username>.github.io. Comma-separate multiple origins.
      - key: ALLOWED_ORIGINS
        sync: false
      # Set these before the first deploy so db:seed can create your admin
      # login. Safe to leave set afterward (seed skips existing users), but
      # if you'd rather not leave the password sitting in Render's config,
      # delete these three after confirming you can log in, then trigger
      # "Manual Deploy" from the Render dashboard (free, no shell needed)
      # to redeploy without them.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        sync: false
