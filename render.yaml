databases:
  - name: mustang-ball-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: mustang-ball-api
    runtime: node
    rootDir: server
    plan: free
    # db:seed is idempotent (it skips any content block that already
    # exists, and safely re-ensures the admin allow-list entry), so it's
    # safe to run on every build. This avoids needing Render's Shell tab,
    # which isn't available on the free plan.
    buildCommand: npm install && npm run build && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mustang-ball-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # 400 days is the longest a session token's cookie-equivalent
      # lifetime is worth setting — effectively "don't expire": sessions
      # only end on explicit sign-out.
      - key: JWT_EXPIRES_IN
        value: 400d
      - key: NODE_ENV
        value: production
      # Update this after your GitHub Pages URL is known, e.g.
      # https://<github-username>.github.io. Comma-separate multiple origins.
      - key: ALLOWED_ORIGINS
        sync: false
      # From a GitHub OAuth App — see server/README.md "Setting up GitHub
      # sign-in". Make sure your production callback URL is registered,
      # not just localhost.
      - key: GITHUB_CLIENT_ID
        sync: false
      # Genuinely secret, unlike the client ID above — never put this in
      # frontend code.
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Allow-lists your first dashboard login — no password, they sign
      # in with GitHub themselves. Safe to leave set permanently.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_NAME
        sync: false
