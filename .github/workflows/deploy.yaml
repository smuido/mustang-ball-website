name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Only one deployment at a time; a new push cancels an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add SPA fallback for client-side routing
        # GitHub Pages has no server to fall back to index.html for routes
        # like /competitors, so a direct visit or refresh 404s. Serving a
        # copy of index.html as 404.html lets React Router take over from
        # there instead.
        run: cp dist/index.html dist/404.html

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
